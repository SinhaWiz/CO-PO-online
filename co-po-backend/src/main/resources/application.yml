spring:
  application:
    name: co-po-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/co_po?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sinhawiz}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has these tables (e.g. a dev DB set up
    # by hand from the desktop app's schema.sql before this migration existed) without
    # trying to re-run V1's CREATE TABLEs against it. Has no effect on a genuinely
    # empty database - Flyway just runs V1 normally there.
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:1fc051ff98d769ef846ab7905a14740d39dc0d8f8e8aab9f088cd1541c232eee}
  expiration: 86400000 # 1 day in ms
  
server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
