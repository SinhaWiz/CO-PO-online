spring:
  application:
    name: co-po-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/co_po?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # No fallback on purpose - DB_PASSWORD must come from the environment in every
    # profile, dev included. See application-dev.yml's header comment for how to set
    # this up locally. Startup fails fast with a clear error if it's missing rather
    # than silently running against a blank/guessed password.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has these tables (e.g. the desktop
    # app's own database, created from its schema.sql before this migration existed)
    # without trying to re-run V1's CREATE TABLEs against it - V1 mirrors what
    # schema.sql already creates almost exactly, so baseline-version must be 1 (not 0)
    # to actually mark V1 itself as done. With baseline-version 0, Flyway would still
    # attempt to run V1 for real against an adopted database and fail immediately on
    # "Table 'Admin' already exists" - a bug in this config caught while writing the
    # migration runbook (see co-po-backend/migration/README.md) rather than by
    # actually running it, since no live database was available anywhere in this
    # project to verify it against directly. V2 and V3 still run for real either way -
    # they're genuine changes beyond what schema.sql ever created. Has no effect at all
    # on a genuinely empty database - Flyway just runs V1, V2, V3 normally there.
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  # Same as DB_PASSWORD - no fallback. A real deployment signs auth tokens with this;
  # a checked-in default would mean anyone who's ever seen this repo can forge a valid
  # login for any account.
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 day in ms

server:
  port: ${SERVER_PORT:8080}

app:
  report-storage:
    # Where generated report/export files (PDFs, Excel workbooks) get written - see
    # ReportStorageService for the full explanation. Empty by default: falls back to
    # preferring the legacy desktop app's own output folders if present, otherwise a
    # local folder relative to wherever the process runs - fine for a single-server
    # deployment. Point this at a real mounted path (e.g. /var/co-po/reports) for
    # anything beyond that.
    base-dir: ${REPORT_STORAGE_DIR:}
