spring:
  application:
    name: co-po-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/co_po?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # No fallback on purpose - DB_PASSWORD must come from the environment in every
    # profile, dev included. See application-dev.yml's header comment for how to set
    # this up locally. Startup fails fast with a clear error if it's missing rather
    # than silently running against a blank/guessed password.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has these tables (e.g. a dev DB set up
    # by hand from the desktop app's schema.sql before this migration existed) without
    # trying to re-run V1's CREATE TABLEs against it. Has no effect on a genuinely
    # empty database - Flyway just runs V1 normally there.
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  # Same as DB_PASSWORD - no fallback. A real deployment signs auth tokens with this;
  # a checked-in default would mean anyone who's ever seen this repo can forge a valid
  # login for any account.
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 day in ms

server:
  port: ${SERVER_PORT:8080}
